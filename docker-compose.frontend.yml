services:
  frontend:
    build:
      context: ./OmniRAG-Ops-Frontend
      dockerfile: Dockerfile
    container_name: omnirg-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    env_file:
      - ./OmniRAG-Ops-Frontend/.env.local
    environment:
      - NODE_ENV=production
      - PORT=${FRONTEND_PORT:-3000}
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:${FRONTEND_PORT:-3000}/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: dokploy-network